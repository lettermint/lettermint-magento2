name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Magento line, on a PHP version that line supports.
          # magento/framework comes from the public Mage-OS mirror (see composer.json),
          # so no repo.magento.com credentials are needed.
          - magento: '2.4.6'
            framework: '103.0.6.*'
            php: '8.2'
          - magento: '2.4.7'
            framework: '103.0.7.*'
            php: '8.3'
          - magento: '2.4.8'
            framework: '103.0.8.*'
            php: '8.4'
          - magento: '2.4.9'
            framework: '103.0.9.*'
            php: '8.5'
            phpstan: true

    name: Magento ${{ matrix.magento }} - PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.magento }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.magento }}-

      # Magento declares PHP extensions (gd, intl, xsl, ...) that the unit tests
      # do not use, so they are not installed.
      - name: Install dependencies
        run: >-
          composer update --prefer-dist --no-interaction --no-progress
          --ignore-platform-req='ext-*'
          --with 'magento/framework:${{ matrix.framework }}'

      - name: Installed versions
        run: composer show | grep -E '^(magento/framework|lettermint/lettermint-php|guzzlehttp/guzzle|laminas/laminas-mime|symfony/mime|monolog/monolog|phpunit/phpunit) '

      - name: Lint PHP files
        run: composer lint

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run PHPStan
        if: matrix.phpstan
        run: composer analyse -- --no-progress --error-format=github
